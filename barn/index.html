<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Barn Treats</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f7f2ec">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #f2efe8;
            --surface: #ece4d6;
            --surface2: #ddd0be;
            --accent: #e8bc9e;
            --accent2: #dbb88a;
            --wood: #d4c4a8;
            --grass: #c8d8b8;
            --text: #4a3f35;
            --text2: #9a8a7a;
            --radius: 14px;
            --font: Georgia, 'Times New Roman', Times, serif;
        }
        html, body {
            height: 100%;
            overflow: hidden;
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            touch-action: manipulation;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(ellipse at 50% 0%, #ece4d6 0%, transparent 60%),
                radial-gradient(ellipse at 50% 105%, var(--grass) 0%, transparent 50%);
            background-color: var(--bg);
        }

        /* Grass strip at bottom */
        #grass {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 40px;
            background: linear-gradient(180deg, var(--grass), #b8c8a8);
            z-index: 0;
            pointer-events: none;
        }

        /* Wooden fence */
        #fence {
            position: fixed;
            bottom: 32px;
            left: 0;
            right: 0;
            height: 20px;
            background:
                linear-gradient(90deg,
                    var(--wood) 0%, var(--wood) 10%, transparent 10%, transparent 11%,
                    var(--wood) 11%, var(--wood) 21%, transparent 21%, transparent 22%,
                    var(--wood) 22%, var(--wood) 32%, transparent 32%, transparent 33%,
                    var(--wood) 33%, var(--wood) 43%, transparent 43%, transparent 44%,
                    var(--wood) 44%, var(--wood) 54%, transparent 54%, transparent 55%,
                    var(--wood) 55%, var(--wood) 65%, transparent 65%, transparent 66%,
                    var(--wood) 66%, var(--wood) 76%, transparent 76%, transparent 77%,
                    var(--wood) 77%, var(--wood) 87%, transparent 87%, transparent 88%,
                    var(--wood) 88%, var(--wood) 100%),
                linear-gradient(180deg, transparent calc(100% - 6px), var(--surface2) calc(100% - 6px));
            z-index: 0;
            pointer-events: none;
        }

        #app {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 24px 24px 72px;
            position: relative;
            z-index: 1;
        }

        /* Settings icon */
        #settingsBtn {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 40px;
            height: 40px;
            border: 1px solid var(--surface2);
            background: var(--surface);
            color: var(--text2);
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font);
        }
        #settingsBtn:hover, #settingsBtn:focus-visible {
            background: var(--surface2);
        }
        #settingsBtn:active {
            transform: scale(0.92);
        }

        /* Wood plank title bar */
        #titleBar {
            background: var(--surface);
            border: 1px solid var(--surface2);
            border-radius: 8px;
            padding: 8px 24px;
            margin-bottom: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }
        #titleBar::before {
            display: none;
        }
        #title {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--text2);
        }

        #subtitle {
            font-size: 14px;
            color: var(--text2);
            margin-bottom: 24px;
            text-align: center;
            line-height: 1.5;
            font-style: italic;
            transition: opacity 0.3s;
        }

        /* Main button */
        #treatButton {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 3px solid var(--accent2);
            background:
                radial-gradient(circle at 40% 35%, #f5e6d3, var(--surface) 60%, var(--surface2));
            font-size: 64px;
            cursor: pointer;
            position: relative;
            transition: transform 0.15s, box-shadow 0.2s;
            box-shadow:
                0 4px 16px rgba(0,0,0,0.06),
                0 8px 32px rgba(0,0,0,0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        #treatButton:hover, #treatButton:focus-visible {
            box-shadow:
                0 6px 24px rgba(0,0,0,0.10),
                0 12px 40px rgba(0,0,0,0.06);
            transform: scale(1.02);
        }
        #treatButton:active {
            transform: scale(0.94);
        }
        #treatButton .label {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #treatButton .label span {
            font-size: 56px;
            line-height: 1;
        }

        /* Rolling indicator */
        #rollingIndicator {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 16px;
            background: var(--surface);
            border: 1px solid var(--surface2);
            border-radius: 20px;
            padding: 6px 16px;
        }
        #rollingIndicator.visible {
            display: flex;
        }
        .rolling-emoji {
            font-size: 24px;
            animation: roll-bounce 0.15s steps(1) infinite;
        }
        @keyframes roll-bounce {
            0% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.2) rotate(15deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        /* Hunger meter */
        #hungerMeter {
            width: 240px;
            margin-bottom: 20px;
            text-align: center;
        }
        #hungerLabel {
            font-size: 11px;
            color: var(--text2);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }
        #trough {
            position: relative;
            height: 20px;
            border-radius: 10px;
            background: var(--surface);
            border: 1px solid var(--surface2);
            overflow: hidden;
        }
        #trough::before {
            display: none;
        }
        #troughFill {
            height: 100%;
            width: 0%;
            border-radius: 10px;
            background: linear-gradient(90deg, var(--accent), var(--accent2) 60%, #e8c8a0);
            transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }
        #troughFill::after {
            display: none;
        }
        #troughFill.glow {
            box-shadow:
                0 0 12px rgba(219, 184, 138, 0.5),
                0 0 24px rgba(219, 184, 138, 0.25);
            animation: trough-glow 1.2s ease-in-out infinite;
        }
        @keyframes trough-glow {
            0%, 100% { box-shadow: 0 0 12px rgba(219, 184, 138, 0.5), 0 0 24px rgba(219, 184, 138, 0.25); }
            50% { box-shadow: 0 0 20px rgba(219, 184, 138, 0.7), 0 0 40px rgba(219, 184, 138, 0.4); }
        }
        #hungerStages {
            display: flex;
            justify-content: space-between;
            margin-top: 4px;
            font-size: 9px;
            color: var(--text2);
            opacity: 0.4;
            padding: 0 4px;
        }
        #hungerStatus {
            font-size: 11px;
            color: var(--text2);
            margin-top: 4px;
            min-height: 1.2em;
        }

        /* Result overlay */
        #resultOverlay {
            position: fixed;
            inset: 0;
            background: rgba(247, 242, 236, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        #resultOverlay.visible {
            display: flex;
            opacity: 1;
        }
        #resultContent {
            text-align: center;
            max-width: 90vw;
            max-height: 85vh;
            animation: result-enter 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }
        @keyframes result-enter {
            0% { transform: scale(0.6) translateY(30px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        #resultVideo {
            max-width: 100%;
            max-height: 55vh;
            border-radius: var(--radius);
            display: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            margin-bottom: 16px;
        }
        #resultVideo.visible {
            display: block;
        }
        #resultEmoji {
            font-size: 72px;
            margin-bottom: 12px;
            display: block;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
        }
        #resultTitle {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        #resultTitle.treat {
            color: var(--accent2);
        }
        #resultTitle.notreat {
            color: var(--text2);
        }
        #resultMessage {
            font-size: 16px;
            color: var(--text2);
            margin-top: 4px;
            line-height: 1.5;
            font-style: italic;
        }
        #resultDismiss {
            margin-top: 24px;
            padding: 10px 32px;
            border: 1px solid var(--surface2);
            border-radius: 20px;
            background: var(--surface);
            color: var(--text2);
            font-size: 14px;
            font-family: var(--font);
            cursor: pointer;
            transition: background 0.2s;
        }
        #resultDismiss:hover {
            background: var(--surface2);
        }
        #resultDismiss.hidden {
            display: none;
        }

        /* Confetti canvas */
        #confettiCanvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 101;
        }

        /* Settings modal */
        #settingsOverlay {
            position: fixed;
            inset: 0;
            background: rgba(247, 242, 236, 0.85);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }
        #settingsOverlay.visible {
            display: flex;
        }
        #settingsModal {
            background: var(--surface);
            border: 1px solid var(--surface2);
            border-radius: var(--radius);
            padding: 28px;
            width: 340px;
            max-width: 92vw;
            max-height: 85vh;
            overflow-y: auto;
            animation: modal-enter 0.3s ease;
            box-shadow: 0 8px 40px rgba(0,0,0,0.08);
            position: relative;
        }
        #settingsModal::before {
            display: none;
        }
        @keyframes modal-enter {
            0% { transform: scale(0.9) translateY(20px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        #settingsModal h2 {
            font-size: 18px;
            margin-bottom: 24px;
            color: var(--text);
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
        .setting-group {
            margin-bottom: 18px;
        }
        .setting-group label {
            display: block;
            font-size: 13px;
            color: var(--text2);
            margin-bottom: 6px;
            font-weight: 500;
        }
        .setting-group input[type="number"],
        .setting-group input[type="text"] {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--surface2);
            border-radius: 8px;
            background: var(--bg);
            color: var(--text);
            font-size: 15px;
            font-family: var(--font);
            outline: none;
            transition: border-color 0.2s;
        }
        .setting-group input[type="number"]:focus,
        .setting-group input[type="text"]:focus {
            border-color: var(--accent2);
        }
        .setting-group .hint {
            font-size: 11px;
            color: var(--text2);
            margin-top: 4px;
            opacity: 0.7;
        }
        .setting-group .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 4px;
        }
        .setting-group .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent2);
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 24px;
        }
        .modal-buttons button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            font-family: var(--font);
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .modal-buttons button:active {
            transform: scale(0.97);
        }
        .modal-buttons .btn-primary {
            background: var(--accent2);
            color: #fff;
        }
        .modal-buttons .btn-primary:hover {
            background: #c9a070;
        }
        .modal-buttons .btn-secondary {
            background: var(--surface2);
            color: var(--text);
        }
        .modal-buttons .btn-secondary:hover {
            background: #d0c0a8;
        }
        .modal-buttons .btn-danger {
            background: #d4a098;
            color: #fff;
        }
        .modal-buttons .btn-danger:hover {
            background: #c09088;
        }
        .modal-close {
            position: absolute;
            top: 12px;
            right: 12px;
            background: none;
            border: none;
            color: var(--text2);
            font-size: 22px;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            z-index: 1;
        }
        .modal-close:hover {
            background: var(--surface2);
        }

        /* Text mode badge */
        #modeBadge {
            position: absolute;
            bottom: 72px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: var(--text2);
            opacity: 0.4;
            letter-spacing: 1px;
            pointer-events: none;
            white-space: nowrap;
        }

        /* Responsive */
        @media (max-width: 480px) {
            #treatButton {
                width: 150px;
                height: 150px;
            }
            #treatButton .label span {
                font-size: 44px;
            }
            #resultEmoji {
                font-size: 56px;
            }
            #resultTitle {
                font-size: 22px;
            }
            #settingsModal {
                padding: 24px;
            }
            #hungerMeter {
                width: 200px;
            }
            #grass {
                height: 32px;
            }
            #fence {
                bottom: 26px;
                height: 16px;
            }
        }
        @media (max-height: 640px) {
            #treatButton {
                width: 120px;
                height: 120px;
            }
            #treatButton .label span {
                font-size: 36px;
            }
            #subtitle {
                margin-bottom: 16px;
            }
            #titleBar {
                padding: 5px 16px;
            }
            #hungerMeter {
                width: 180px;
                margin-bottom: 12px;
            }
            #trough {
                height: 16px;
            }
            #hungerStages, #hungerStatus {
                display: none;
            }
            #grass {
                height: 28px;
            }
            #fence {
                bottom: 22px;
                height: 14px;
            }
            #app {
                padding: 24px 24px 56px;
            }
            #modeBadge {
                bottom: 56px;
            }
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--surface2);
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div id="grass"></div>
    <div id="fence"></div>

    <div id="app">
        <button id="settingsBtn" aria-label="Settings">&#9881;</button>

        <div id="titleBar">
            <div id="title">Barn Treats</div>
        </div>
        <div id="subtitle">See what the piggy has for you</div>

        <div id="rollingIndicator">
            <span class="rolling-emoji">&#127920;</span>
            <span id="rollingText" style="color:var(--text2);font-size:14px;">The piggy is thinkin&rsquo;...</span>
        </div>

        <div id="hungerMeter">
            <div id="hungerLabel">Treat Meter</div>
            <div id="trough">
                <div id="troughFill"></div>
            </div>
            <div id="hungerStages">
                <span>stuffed</span>
                <span>hungry</span>
                <span>starvin&rsquo;</span>
            </div>
            <div id="hungerStatus">The piggy is full</div>
        </div>

        <button id="treatButton">
            <span class="label">
                <span>&#128056;</span>
            </span>
        </button>

        <div id="modeBadge">text mode</div>
    </div>

    <!-- Result overlay -->
    <div id="resultOverlay">
        <div id="resultContent">
            <video id="resultVideo" playsinline muted></video>
            <div id="resultEmoji"></div>
            <div id="resultTitle"></div>
            <div id="resultMessage"></div>
            <button id="resultDismiss">Back to barn</button>
        </div>
    </div>
    <canvas id="confettiCanvas" width="0" height="0"></canvas>

    <!-- Settings -->
    <div id="settingsOverlay">
        <div id="settingsModal">
            <button class="modal-close" id="settingsClose">&times;</button>
            <h2>Barn Settings</h2>

            <div class="setting-group">
                <label for="counterInput">Total Treats</label>
                <input type="number" id="counterInput" min="0" step="1" readonly style="background:var(--bg);color:var(--text2);cursor:not-allowed;border-color:var(--surface2);">
                <div class="hint">How many times you&rsquo;ve asked. Read-only.</div>
            </div>

            <div class="setting-group">
                <div class="checkbox-group">
                    <input type="checkbox" id="textModeOnly">
                    <label for="textModeOnly" style="margin:0;">Text-only mode (ignore videos)</label>
                </div>
            </div>

            <div class="setting-group">
                <div class="checkbox-group">
                    <input type="checkbox" id="showCounter">
                    <label for="showCounter" style="margin:0;">Show counter on screen</label>
                </div>
            </div>

            <div class="modal-buttons">
                <button class="btn-primary" id="settingsSave">Save</button>
                <button class="btn-secondary" id="settingsCancel">Cancel</button>
                <button class="btn-danger" id="settingsReset">Reset All</button>
            </div>
        </div>
    </div>

    <script>
    (function() {
        'use strict';

        const DEFAULTS = {
            counter: 0,
            patsSinceLastTreat: 0,
            videoPaths: ['videos/treat.mp4'],
            textModeOnly: false,
            showCounter: false,
        };

        const STORAGE_KEY = 'treat-button-state';

        // Internal probability constants (not configurable)
        const MIN_CHANCE = 0.04;
        const MAX_CHANCE = 0.99;
        const STREAK_CAP = 10;

        let state = loadState();
        let isAnimating = false;
        let rollingInterval = null;

        // DOM refs
        const btn = document.getElementById('treatButton');
        const subtitleEl = document.getElementById('subtitle');
        const modeBadge = document.getElementById('modeBadge');
        const btnEmoji = btn.querySelector('.label span');
        const resultOverlay = document.getElementById('resultOverlay');
        const resultVideo = document.getElementById('resultVideo');
        const resultEmoji = document.getElementById('resultEmoji');
        const resultTitle = document.getElementById('resultTitle');
        const resultMessage = document.getElementById('resultMessage');
        const resultDismiss = document.getElementById('resultDismiss');
        const rollingIndicator = document.getElementById('rollingIndicator');
        const rollingText = document.getElementById('rollingText');
        const settingsOverlay = document.getElementById('settingsOverlay');
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsClose = document.getElementById('settingsClose');
        const settingsSave = document.getElementById('settingsSave');
        const settingsCancel = document.getElementById('settingsCancel');
        const settingsReset = document.getElementById('settingsReset');
        const counterInput = document.getElementById('counterInput');
        const textModeOnlyCheck = document.getElementById('textModeOnly');
        const showCounterCheck = document.getElementById('showCounter');
        const troughFill = document.getElementById('troughFill');
        const hungerStatus = document.getElementById('hungerStatus');
        const confettiCanvas = document.getElementById('confettiCanvas');

        function loadState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    return { ...DEFAULTS, ...parsed };
                }
            } catch (e) {}
            return { ...DEFAULTS };
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            } catch (e) {}
        }

        // ---------- Probability ----------
        function getTreatProbability() {
            const t = Math.min(1, state.patsSinceLastTreat / STREAK_CAP);
            const curve = t * t * (3 - 2 * t);
            const prob = MIN_CHANCE + (MAX_CHANCE - MIN_CHANCE) * curve;
            const jitter = (Math.random() - 0.5) * 0.1;
            return Math.max(MIN_CHANCE, Math.min(MAX_CHANCE, prob + jitter));
        }

        function isTreat() {
            return Math.random() < getTreatProbability();
        }

        // ---------- Hunger Meter ----------
        const HUNGER_STATUSES = [
            { max: 0.25, label: 'The piggy is full' },
            { max: 0.50, label: 'The piggy is peckish' },
            { max: 0.75, label: 'The piggy is getting hungry' },
            { max: 0.90, label: 'The piggy is very hungry!' },
            { max: 1.00, label: 'The piggy is STARVING!' },
        ];
        function updateHungerMeter() {
            const pct = Math.min(100, (state.patsSinceLastTreat / STREAK_CAP) * 100);
            troughFill.style.width = pct + '%';
            troughFill.classList.toggle('glow', pct >= 90);
            const status = HUNGER_STATUSES.find(s => pct / 100 <= s.max) || HUNGER_STATUSES[HUNGER_STATUSES.length - 1];
            hungerStatus.textContent = status.label;
        }

        // ---------- Confetti (farm colors) ----------
        function launchConfetti() {
            const canvas = confettiCanvas;
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const colors = ['#d4a017', '#cc3333', '#228B22', '#8B6914', '#f5e6d3', '#cd5c5c'];
            const particles = [];
            const count = 120;

            for (let i = 0; i < count; i++) {
                particles.push({
                    x: canvas.width * 0.5 + (Math.random() - 0.5) * 120,
                    y: canvas.height * 0.3,
                    vx: (Math.random() - 0.5) * 14,
                    vy: -Math.random() * 16 - 4,
                    w: Math.random() * 10 + 3,
                    h: Math.random() * 6 + 3,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rotation: Math.random() * 360,
                    rotSpeed: (Math.random() - 0.5) * 12,
                    gravity: 0.3 + Math.random() * 0.15,
                    drag: 0.99,
                });
            }

            let frame = 0;
            const maxFrames = 200;

            function animate() {
                if (frame >= maxFrames) {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    return;
                }
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                for (const p of particles) {
                    p.vy += p.gravity;
                    p.vx *= p.drag;
                    p.vy *= p.drag;
                    p.x += p.vx;
                    p.y += p.vy;
                    p.rotation += p.rotSpeed;

                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rotation * Math.PI / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                    ctx.restore();
                }

                frame++;
                requestAnimationFrame(animate);
            }
            animate();
        }

        // ---------- Rolling animation ----------
        const VERBS = [
            'is thinking', 'is dreaming', 'is looking', 'is searching',
            'is hoping', 'is wishing', 'is waiting', 'is checking',
            'is planning', 'is humming', 'is wondering', 'is asking',
            'is peeking', 'is smiling', 'is listening', 'is preparing',
            'is gazing', 'is resting', 'is nodding', 'is hoping',
        ];
        const ADVERBS = [
            'happily', 'eagerly', 'gently', 'quietly',
            'secretly', 'patiently', 'carefully', 'proudly',
            'softly', 'sleepily', 'merrily', 'fondly',
            'gratefully', 'playfully', 'calmly', 'warmly',
            'slowly', 'brightly', 'sneakily', 'lovingly',
        ];
        const ACTIONS = [
            'about their favourite snack', 'for a tasty treat',
            'about how great you are', 'in the cozy hay',
            'through the snack stash', 'at the twinkling stars',
            'for hidden goodies', 'for you',
            'on the lookout', 'about what to get you',
            'in the warm barn', 'about today',
            'for the perfect moment', 'with all their heart',
            'about nothing at all', 'for a little while',
            'in piggy heaven', 'about the little things',
            'for a snack break', 'about tomorrow',
        ];
        function randomRollingMessage() {
            const verb = VERBS[Math.floor(Math.random() * VERBS.length)];
            const adverb = ADVERBS[Math.floor(Math.random() * ADVERBS.length)];
            const action = ACTIONS[Math.floor(Math.random() * ACTIONS.length)];
            return `Piggy ${verb} ${adverb} ${action}...`;
        }
        function startRolling() {
            const emojis = ['🐷', '🍟', '🍿', '🥨', '🌾', '🧀', '🍎', '🥜', '🍪', '🍩'];
            let idx = 0;
            rollingIndicator.classList.add('visible');
            rollingIndicator.querySelector('.rolling-emoji').textContent = emojis[0];
            rollingText.textContent = randomRollingMessage();

            rollingInterval = setInterval(() => {
                idx = (idx + 1) % emojis.length;
                rollingIndicator.querySelector('.rolling-emoji').textContent = emojis[idx];
            }, 100);
        }

        function stopRolling() {
            rollingIndicator.classList.remove('visible');
            if (rollingInterval) {
                clearInterval(rollingInterval);
                rollingInterval = null;
            }
        }

        // ---------- Video playback ----------
        async function tryPlayVideo(paths) {
            for (const p of paths) {
                const src = p.trim();
                if (!src) continue;
                resultVideo.src = src;
                resultVideo.style.display = 'block';
                resultVideo.load();
                try {
                    await resultVideo.play();
                    resultVideo.classList.add('visible');
                    return true;
                } catch {
                    resultVideo.style.display = 'none';
                    resultVideo.classList.remove('visible');
                }
            }
            return false;
        }

        // ---------- Handle click ----------
        async function handleClick() {
            if (isAnimating) return;
            isAnimating = true;

            state.counter++;
            state.patsSinceLastTreat++;
            saveState();
            updateUI();

            btnEmoji.textContent = '🐖';
            startRolling();

            const treat = isTreat();

            // Anticipation
            const delay = 1200 + Math.random() * 800;
            await new Promise(r => setTimeout(r, delay));
            stopRolling();

            // Reset overlay
            resultVideo.classList.remove('visible');
            resultVideo.pause();
            resultVideo.src = '';
            resultVideo.style.display = '';
            resultDismiss.classList.remove('hidden');

            // No-treat is always text
            if (!treat) {
                resultEmoji.textContent = '😔';
                resultTitle.textContent = 'No treat today';
                resultTitle.className = 'notreat';
                resultMessage.textContent = 'No luck this time. Try again!';
                resultOverlay.classList.add('visible');
                btnEmoji.textContent = '😔';
            } else {
                state.patsSinceLastTreat = 0;
                saveState();
                updateUI();
                // Treat — try video unless text-only mode
                let videoPlayed = false;
                if (!state.textModeOnly && state.videoPaths.length > 0) {
                    videoPlayed = await tryPlayVideo(state.videoPaths);
                }

                if (videoPlayed) {
                    resultEmoji.textContent = '';
                    resultTitle.textContent = '';
                    resultTitle.className = '';
                    resultMessage.textContent = '';
                    resultDismiss.classList.add('hidden');

                    resultVideo.addEventListener('ended', () => {
                        resultDismiss.classList.remove('hidden');
                    }, { once: true });

                    setTimeout(() => {
                        resultDismiss.classList.remove('hidden');
                    }, 8000);
                } else {
                    resultEmoji.textContent = '🐷';
                    resultTitle.textContent = 'TREAT TIME!';
                    resultTitle.className = 'treat';
                    resultMessage.textContent = 'The piggy shared a snack!';
                }

                launchConfetti();
                resultOverlay.classList.add('visible');
                btnEmoji.textContent = '🎉';
            }

            setTimeout(() => {
                if (!isAnimating) btnEmoji.textContent = '🐷';
            }, 1500);

            isAnimating = false;
        }

        // ---------- Dismiss ----------
        function dismissResult() {
            resultOverlay.classList.remove('visible');
            resultVideo.pause();
            resultVideo.src = '';
            resultVideo.classList.remove('visible');
            resultVideo.style.display = '';
            resultDismiss.classList.remove('hidden');
            btnEmoji.textContent = '🐷';
        }

        // ---------- Settings ----------
        function openSettings() {
            counterInput.value = state.counter;
            textModeOnlyCheck.checked = state.textModeOnly;
            showCounterCheck.checked = state.showCounter;
            settingsOverlay.classList.add('visible');
        }

        function closeSettings() {
            settingsOverlay.classList.remove('visible');
        }

        function saveSettings() {
            const nc = parseInt(counterInput.value, 10);
            if (!isNaN(nc) && nc >= 0) state.counter = nc;

            state.textModeOnly = textModeOnlyCheck.checked;
            state.showCounter = showCounterCheck.checked;

            saveState();
            updateUI();
            closeSettings();
        }

        function resetAll() {
            if (confirm('Reset everything? Counter and all settings will be cleared.')) {
                state = { ...DEFAULTS };
                saveState();
                closeSettings();
                updateUI();
            }
        }

        // ---------- UI update ----------
        function updateUI() {
            subtitleEl.textContent = state.showCounter
                ? `Ask the piggy for a treat · ${state.counter} times`
                : 'See what the piggy has for you';

            if (state.textModeOnly || state.videoPaths.length === 0) {
                modeBadge.textContent = 'text mode';
            } else {
                modeBadge.textContent = '🎬 video ready';
            }

            updateHungerMeter();
        }

        // ---------- Keyboard ----------
        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'Enter') {
                if (settingsOverlay.classList.contains('visible')) {
                    if (e.key === 'Enter') saveSettings();
                    return;
                }
                if (resultOverlay.classList.contains('visible')) {
                    dismissResult();
                    return;
                }
                e.preventDefault();
                handleClick();
            }
            if (e.key === 'Escape') {
                if (resultOverlay.classList.contains('visible')) dismissResult();
                if (settingsOverlay.classList.contains('visible')) closeSettings();
            }
        });

        // ---------- Events ----------
        btn.addEventListener('click', handleClick);
        resultDismiss.addEventListener('click', dismissResult);
        resultOverlay.addEventListener('click', (e) => {
            if (e.target === resultOverlay) dismissResult();
        });
        settingsBtn.addEventListener('click', openSettings);
        settingsClose.addEventListener('click', closeSettings);
        settingsCancel.addEventListener('click', closeSettings);
        settingsOverlay.addEventListener('click', (e) => {
            if (e.target === settingsOverlay) closeSettings();
        });
        settingsSave.addEventListener('click', saveSettings);
        settingsReset.addEventListener('click', resetAll);

        window.addEventListener('resize', () => {
            confettiCanvas.width = window.innerWidth;
            confettiCanvas.height = window.innerHeight;
        });

        // ---------- Service worker ----------
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }

        // ---------- Init ----------
        updateUI();
        console.log('🐷 Barn Treats loaded!');
        console.log('   Looking for videos/treat.mp4 by default.');
        console.log('   Fallback to text mode if no video is found.');
    })();
    </script>
</body>
</html>
